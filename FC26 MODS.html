
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC26 Mod Manager Pro</title>
<style>
body{font-family:Segoe UI,Arial;background:#0f1117;color:#fff;margin:0}
header{background:#151a22;padding:20px;text-align:center}
.container{max-width:1200px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
input,select{padding:12px;border-radius:8px;border:1px solid #333;background:#1c2330;color:#fff}
button{padding:12px;border:none;border-radius:8px;background:#00c16a;color:#fff;cursor:pointer}
.card{background:#1a1f2b;border-radius:12px;padding:15px;margin-top:12px}
.badge{padding:4px 8px;border-radius:20px;background:#333;font-size:12px}
.installed{background:#00c16a}
.todo{background:#ff9800}
.topbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
a{color:#7db8ff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
.stat{background:#1a1f2b;padding:15px;border-radius:10px;text-align:center}
</style>
</head>
<body>
<header>
<h1>🎮 FC26 Mod Manager PRO</h1>
<p>Zarządzaj wszystkimi modami w jednym miejscu</p>
</header>

<div class="container">

<div class="stats">
<div class="stat"><h2 id="modsCount">0</h2><div>Modów</div></div>
<div class="stat"><h2 id="installedCount">0</h2><div>Zainstalowane</div></div>
<div class="stat"><h2 id="careerCount">0</h2><div>Career</div></div>
<div class="stat"><h2 id="gameplayCount">0</h2><div>Gameplay</div></div>
</div>

<div class="grid">
<input id="name" placeholder="Nazwa moda">
<input id="link" placeholder="Link">
<select id="category">
<option>Career Mode</option>
<option>Gameplay</option>
<option>Faces</option>
<option>Kits</option>
<option>Graphics</option>
<option>Other</option>
</select>
<select id="status">
<option>Do pobrania</option>
<option>Zainstalowany</option>
</select>
</div>

<br>
<button onclick="addMod()">➕ Dodaj Mod</button>

<hr>

<div class="topbar">
<input id="search" placeholder="Szukaj..." onkeyup="render()">
<select id="filter" onchange="render()">
<option value="all">Wszystkie</option>
<option value="Career Mode">Career Mode</option>
<option value="Gameplay">Gameplay</option>
<option value="Faces">Faces</option>
<option value="Kits">Kits</option>
<option value="Graphics">Graphics</option>
<option value="Other">Other</option>
</select>
<button onclick="exportData()">💾 Eksport JSON</button>
<input type="file" id="importFile" onchange="importData(event)">
</div>

<div id="mods"></div>

</div>

<script>
let mods=JSON.parse(localStorage.getItem("fc26_pro_mods")||"[]");

function save(){
 localStorage.setItem("fc26_pro_mods",JSON.stringify(mods));
 updateStats();
 render();
}

function addMod(){
 const mod={
  id:Date.now(),
  name:name.value,
  link:link.value,
  category:category.value,
  status:status.value
 };
 if(!mod.name)return;
 mods.push(mod);
 name.value='';link.value='';
 save();
}

function del(id){
 mods=mods.filter(x=>x.id!==id);
 save();
}

function toggle(id){
 const m=mods.find(x=>x.id===id);
 m.status=m.status==="Zainstalowany"?"Do pobrania":"Zainstalowany";
 save();
}

function updateStats(){
 modsCount.innerText=mods.length;
 installedCount.innerText=mods.filter(x=>x.status==="Zainstalowany").length;
 careerCount.innerText=mods.filter(x=>x.category==="Career Mode").length;
 gameplayCount.innerText=mods.filter(x=>x.category==="Gameplay").length;
}

function render(){
 let data=[...mods];
 const s=search.value.toLowerCase();
 const f=filter.value;

 data=data.filter(x=>x.name.toLowerCase().includes(s));
 if(f!=="all") data=data.filter(x=>x.category===f);

 mods.innerHTML=data.map(m=>`
 <div class="card">
 <h3>${m.name}</h3>
 <span class="badge">${m.category}</span>
 <span class="badge ${m.status==='Zainstalowany'?'installed':'todo'}">${m.status}</span>
 <p>${m.link?`<a href="${m.link}" target="_blank">Otwórz link</a>`:''}</p>
 <button onclick="toggle(${m.id})">Zmień status</button>
 <button onclick="del(${m.id})">Usuń</button>
 </div>
 `).join('');
}

function exportData(){
 const blob=new Blob([JSON.stringify(mods,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='fc26_mods_backup.json';
 a.click();
}

function importData(e){
 const file=e.target.files[0];
 const reader=new FileReader();
 reader.onload=function(){
  mods=JSON.parse(reader.result);
  save();
 };
 reader.readAsText(file);
}

updateStats();
render();
</script>
</body>
</html>
