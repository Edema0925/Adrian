<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC26 Mods</title>

<style>
body{
    margin:0;
    font-family: 'Arial', sans-serif;
    color:white;
    background:
        radial-gradient(circle at top, rgba(0,255,140,.15), transparent 40%),
        radial-gradient(circle at bottom, rgba(0,180,255,.12), transparent 50%),
        linear-gradient(120deg, #05070d, #0b1220);
    overflow-x:hidden;
}

/* delikatny „stadion / futurystyczny vibe” */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        url("https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=1400&q=60");
    background-size:cover;
    background-position:center;
    opacity:.08;
    z-index:-1;
    filter:blur(1px) saturate(1.2);
}

.container{
    max-width:900px;
    margin:auto;
    padding:25px;
}

h1{
    text-align:center;
    color:#00ff88;
    letter-spacing:2px;
    text-transform:uppercase;
    text-shadow:0 0 10px rgba(0,255,136,.4);
}

.sub{
    text-align:center;
    opacity:.7;
    margin-bottom:20px;
}

input,
textarea{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin:6px 0;
    border-radius:12px;
    border:1px solid rgba(0,255,136,.4);
    background:rgba(10,15,25,.7);
    color:white;
    outline:none;
    transition:.2s;
}

input:focus,
textarea:focus{
    border-color:#00ff88;
    box-shadow:0 0 12px rgba(0,255,136,.25);
}

textarea{
    min-height:110px;
    resize:vertical;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    color:#00140a;
    background:linear-gradient(90deg,#00ff88,#00ccff);
    box-shadow:0 0 15px rgba(0,255,200,.2);
    transition:.2s;
}

button:hover{
    transform:scale(1.02);
    box-shadow:0 0 25px rgba(0,255,200,.35);
}

.form{
    display:none;
    background:rgba(0,0,0,.65);
    padding:15px;
    border-radius:14px;
    margin-top:20px;
    border:1px solid rgba(0,255,136,.2);
    backdrop-filter:blur(8px);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    margin-top:20px;
}

.card{
    background:rgba(10,15,25,.75);
    border:1px solid rgba(0,255,136,.15);
    padding:15px;
    border-radius:14px;
    position:relative;
    transition:.25s;
    backdrop-filter:blur(6px);
}

.card:hover{
    transform:translateY(-4px);
    border-color:#00ff88;
    box-shadow:0 0 18px rgba(0,255,136,.15);
}

.title{
    color:#00ff88;
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
    text-shadow:0 0 8px rgba(0,255,136,.2);
}

.desc{
    opacity:.8;
    font-size:13px;
    margin-bottom:12px;
}

.delete{
    position:absolute;
    top:8px;
    right:8px;
    width:auto;
    padding:5px 8px;
    background:#ff2b2b;
    color:white;
    border-radius:8px;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

    <h1>FC26 Mods</h1>
    <div class="sub">Upload + Download System</div>

    <button onclick="login()">Zaloguj się przez Google</button>

    <div class="form" id="form">

        <input id="name" placeholder="Nazwa moda">

        <textarea id="desc" placeholder="Opis moda"></textarea>

        <input id="fileUrl" placeholder="Link do pliku (Google Drive / MediaFire / itp.)">

        <button onclick="addMod()">Dodaj moda</button>

    </div>

    <div class="grid" id="mods"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4GAAVlZEhZuUvsf5RVhHJYngcEjIrVdg",
  authDomain: "fc26mods.firebaseapp.com",
  projectId: "fc26mods",
  storageBucket: "fc26mods.appspot.com",
  messagingSenderId: "136509847285",
  appId: "1:136509847285:web:d2d81cf7832194370d37bc",
  measurementId: "G-SC0XK44T2E"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

const provider = new GoogleAuthProvider();

const ALLOWED_USERS = [
    "adamskiadrian513@gmail.com"
];

let currentUser = null;

window.login = () => {
    signInWithPopup(auth, provider);
};

onAuthStateChanged(auth, (user) => {

    currentUser = user;

    if (user && ALLOWED_USERS.includes(user.email)) {
        document.getElementById("form").style.display = "block";
    } else {
        document.getElementById("form").style.display = "none";
    }

    loadMods();
});

window.addMod = async function(){

    try{

        const name = document.getElementById("name").value.trim();
        const desc = document.getElementById("desc").value.trim();
        const fileUrl = document.getElementById("fileUrl").value.trim();

        if(!name){
            alert("Podaj nazwę moda");
            return;
        }

        await addDoc(collection(db, "mods"), {
            name,
            desc,
            fileUrl,
            time: Date.now()
        });

        alert("mod dodany ✔");

        document.getElementById("name").value = "";
        document.getElementById("desc").value = "";
        document.getElementById("fileUrl").value = "";

        loadMods();

    }catch(err){
        console.error(err);
        alert(err.message);
    }
};

window.deleteMod = async function(id){

    if(!confirm("Usunąć tego moda?")){
        return;
    }

    await deleteDoc(doc(db, "mods", id));

    loadMods();
};

async function loadMods(){

    const q = query(
        collection(db, "mods"),
        orderBy("time", "desc")
    );

    const snap = await getDocs(q);

    const box = document.getElementById("mods");

    box.innerHTML = "";

    snap.forEach((d) => {

        const m = d.data();

        box.innerHTML += `
            <div class="card">

                ${
                    currentUser &&
                    ALLOWED_USERS.includes(currentUser.email)
                    ? `<button class="delete" onclick="deleteMod('${d.id}')">X</button>`
                    : ""
                }

                <div class="title">${m.name}</div>

                <div class="desc">
                    ${m.desc || ""}
                </div>

                ${
                    m.fileUrl
                    ? `<a href="${m.fileUrl}" target="_blank">
                        <button>⬇ Pobierz</button>
                      </a>`
                    : ""
                }

            </div>
        `;
    });
}

</script>

</body>
</html>
