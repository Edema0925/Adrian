<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FC26 Mods</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  background:#05070d;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  color:#00ff88;
  text-shadow:0 0 20px #00ff88;
}

.sub{
  text-align:center;
  opacity:0.6;
  margin-bottom:20px;
}

.login{
  text-align:center;
  margin-bottom:15px;
}

input,textarea{
  width:100%;
  margin:6px 0;
  padding:10px;
  border-radius:10px;
  border:1px solid #00ff88;
  background:rgba(0,0,0,0.5);
  color:white;
}

button{
  background:linear-gradient(90deg,#00ff88,#00ccff);
  border:none;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  transform:scale(1.05);
}

.form{
  display:none;
  background:rgba(0,0,0,0.6);
  padding:15px;
  border-radius:12px;
  border:1px solid rgba(0,255,136,0.3);
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.card{
  background:rgba(0,0,0,0.6);
  border:1px solid rgba(0,255,136,0.2);
  border-radius:12px;
  padding:10px;
  position:relative;
}

.title{
  color:#00ff88;
  font-weight:bold;
  margin-bottom:5px;
}

.desc{
  opacity:0.8;
  font-size:13px;
  margin-bottom:10px;
}

.delete{
  position:absolute;
  top:8px;
  right:8px;
  background:red;
  border:none;
  color:white;
  padding:5px 8px;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
  <h1>FC26 Mods</h1>
  <div class="sub">Mods system</div>

  <div class="login">
    <button onclick="login()">Zaloguj się</button>
  </div>

  <div class="form" id="form">

    <input id="name" placeholder="Nazwa moda">
    <textarea id="desc" placeholder="Opis moda"></textarea>

    <input type="file" id="file">

    <button onclick="addMod()">Dodaj mod</button>
  </div>

  <div class="grid" id="mods"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4GAAVlZEhZuUvsf5RVhHJYngcEjIrVdg",
  authDomain: "fc26mods.firebaseapp.com",
  projectId: "fc26mods",
  storageBucket: "fc26mods.firebasestorage.app",
  messagingSenderId: "136509847285",
  appId: "1:136509847285:web:d2d81cf7832194370d37bc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const provider = new GoogleAuthProvider();

const ALLOWED_USERS = [
  "adamskiadrian513@gmail.com"
];

let currentUser = null;

window.login = function(){
  signInWithPopup(auth, provider);
};

onAuthStateChanged(auth, (user)=>{
  currentUser = user;

  if(user && ALLOWED_USERS.includes(user.email)){
    document.getElementById("form").style.display="block";
    loadMods();
  } else {
    document.getElementById("form").style.display="none";
  }
});

window.addMod = async function(){

  const name = document.getElementById("name").value;
  const desc = document.getElementById("desc").value;
  const file = document.getElementById("file").files[0];

  if(!name) return;

  let fileUrl = "";

  if(file){
    const fileRef = ref(storage, "mods/" + Date.now() + file.name);
    await uploadBytes(fileRef, file);
    fileUrl = await getDownloadURL(fileRef);
  }

  await addDoc(collection(db,"mods"),{
    name,
    desc,
    fileUrl,
    time: Date.now()
  });

  document.getElementById("name").value = "";
  document.getElementById("desc").value = "";
  document.getElementById("file").value = "";

  loadMods();
};

window.deleteMod = async function(id){
  await deleteDoc(doc(db,"mods",id));
  loadMods();
};

async function loadMods(){

  const q = query(collection(db,"mods"), orderBy("time","desc"));
  const snap = await getDocs(q);

  const box = document.getElementById("mods");
  box.innerHTML="";

  snap.forEach(d=>{
    const m = d.data();

    box.innerHTML += `
      <div class="card">

        ${currentUser && ALLOWED_USERS.includes(currentUser.email) ? 
          `<button class="delete" onclick="deleteMod('${d.id}')">X</button>` : ""}

        <div class="title">${m.name || ""}</div>
        <div class="desc">${m.desc || ""}</div>

        ${m.fileUrl ? `
          <a href="${m.fileUrl}" target="_blank">
            <button style="margin-top:10px;width:100%;">
              ⬇ Pobierz plik
            </button>
          </a>
        ` : ""}

      </div>
    `;
  });
}

</script>

</body>
</html>
