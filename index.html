<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC26 Mods</title>

<style>/* ===== GLOBAL ===== */
/* ===== GLOBAL ===== */
body{
    margin:0;
    font-family: 'Inter', Arial, sans-serif;
    color:#d1d1d6;
    overflow-x:hidden;

    background:
        linear-gradient(135deg, rgba(0,0,0,.85), rgba(0,0,0,.4)),
        url("https://wallpapers.com/images/hd/ea-sports-fc-24-4k-8jz8z7x6q7z7z7x6.jpg")
        center/cover no-repeat fixed;
}

/* Matowy glow */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 30% 10%, rgba(255,255,255,0.05), transparent 60%),
        radial-gradient(circle at bottom, rgba(0,0,0,0.7), transparent 70%);
    z-index:-1;
}

/* ===== TOP BAR ===== */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;

    background:rgba(26,26,29,.55);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
    font-size:20px;
    font-weight:900;
    letter-spacing:4px;
    color:#d1d1d6;
    text-shadow:0 0 8px rgba(255,255,255,.1);
}

.menu{
    display:flex;
    gap:20px;
    font-size:14px;
    opacity:.8;
}

/* ===== CONTAINER ===== */
.container{
    max-width:1200px;
    margin:auto;
    padding:25px;
}

/* ===== TITLE ===== */
h1{
    font-size:32px;
    text-transform:uppercase;
    letter-spacing:5px;
    color:#d1d1d6;
    margin-bottom:5px;
    text-shadow:0 0 10px rgba(255,255,255,.1);
}

.sub{
    opacity:.7;
    margin-bottom:25px;
}

/* ===== FORM ===== */
.form{
    display:none;
    background:rgba(42,42,49,.55);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:18px;
    margin-bottom:25px;
    backdrop-filter:blur(12px);
}

/* ===== INPUTS ===== */
input, textarea{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(0,0,0,.45);
    color:#d1d1d6;
    outline:none;
    transition:.2s;
}

input:focus, textarea:focus{
    border-color:#8f8fa3;
    box-shadow:0 0 10px rgba(143,143,163,.3);
}

/* ===== BUTTON ===== */
button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
    letter-spacing:1px;
    background:linear-gradient(135deg,#3c3c45,#2a2a31);
    color:#d1d1d6;
    transition:.25s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 0 18px rgba(143,143,163,.3);
}

/* ===== GRID ===== */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

/* ===== CARD ===== */
.card{
    background:rgba(26,26,29,.55);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    overflow:hidden;
    transition:.25s;
    position:relative;
    backdrop-filter:blur(12px);
}

.card:hover{
    transform:translateY(-8px) scale(1.02);
    border-color:#8f8fa3;
    box-shadow:0 0 25px rgba(143,143,163,.3);
}

/* IMAGE */
.card img{
    width:100%;
    height:190px;
    object-fit:cover;
    filter:contrast(1.1) brightness(.9);
}

/* CONTENT */
.card-content{
    padding:14px;
}

.title{
    font-size:17px;
    font-weight:800;
    letter-spacing:1px;
    color:#d1d1d6;
}

.desc{
    opacity:.75;
    font-size:14px;
    margin-top:6px;
}

/* DELETE BUTTON */
.delete{
    position:absolute;
    top:12px;
    right:12px;
    width:32px;
    height:32px;
    border-radius:10px;
    background:rgba(0,0,0,.6);
    border:1px solid rgba(255,255,255,.1);
    color:white;
    cursor:pointer;
    transition:.2s;
}

.delete:hover{
    background:#ff0033;
    transform:scale(1.1);
}

</style>

<body>
    <div class="topbar">
  <div class="logo">FC26 MODS</div>
  <div class="menu">
    <div>HOME</div>
    <div>MODS</div>
    <div>UPLOAD</div>
  </div>
</div>

<div class="container">

    <h1>FC26 Mods</h1>
    <div class="sub">Upload + Download System</div>

    <button onclick="login()">Zaloguj się przez Google</button>

    <div class="form" id="form">

        <input id="name" placeholder="Nazwa moda">
        <textarea id="desc" placeholder="Opis moda"></textarea>
        <input id="fileUrl" placeholder="Link do pliku (download)">
        <input id="imgFile" type="file" accept="image/*">

        <button onclick="addMod()">Dodaj moda</button>

    </div>

    <div class="grid" id="mods"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4GAAVlZEhZuUvsf5RVhHJYngcEjIrVdg",
  authDomain: "fc26mods.firebaseapp.com",
  projectId: "fc26mods",
  storageBucket: "fc26mods.appspot.com",
  messagingSenderId: "136509847285",
  appId: "1:136509847285:web:d2d81cf7832194370d37bc",
  measurementId: "G-SC0XK44T2E"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const ALLOWED_USERS = ["adamskiadrian513@gmail.com"];
let currentUser = null;

window.login = () => signInWithPopup(auth, provider);

onAuthStateChanged(auth, (user) => {
    currentUser = user;

    document.getElementById("form").style.display =
        (user && ALLOWED_USERS.includes(user.email)) ? "block" : "none";

    loadMods();
});

function toBase64(file){
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

window.addMod = async function(){

    const name = document.getElementById("name").value.trim();
    const desc = document.getElementById("desc").value.trim();
    const fileUrl = document.getElementById("fileUrl").value.trim();
    const imgFile = document.getElementById("imgFile").files[0];

    if(!name) return alert("Podaj nazwę moda");

    let imgBase64 = "";

    if(imgFile){
        imgBase64 = await toBase64(imgFile);
    }

    await addDoc(collection(db, "mods"), {
        name,
        desc,
        fileUrl,
        imgUrl: imgBase64,
        time: Date.now()
    });

    document.getElementById("name").value = "";
    document.getElementById("desc").value = "";
    document.getElementById("fileUrl").value = "";
    document.getElementById("imgFile").value = "";

    loadMods();
};

window.deleteMod = async function(id){
    if(confirm("Usunąć moda?")){
        await deleteDoc(doc(db, "mods", id));
        loadMods();
    }
};

async function loadMods(){

    const q = query(collection(db, "mods"), orderBy("time","desc"));
    const snap = await getDocs(q);

    const box = document.getElementById("mods");
    box.innerHTML = "";

    snap.forEach((d) => {
        const m = d.data();

        box.innerHTML += `
            <div class="card">

                ${m.imgUrl ? `<img src="${m.imgUrl}">` : ""}

                <div class="card-content">

                    ${
                        currentUser && ALLOWED_USERS.includes(currentUser.email)
                        ? `<button class="delete" onclick="deleteMod('${d.id}')">×</button>`
                        : ""
                    }

                    <div class="title">${m.name}</div>
                    <div class="desc">${m.desc || ""}</div>

                    ${
                        m.fileUrl
                        ? `<a href="${m.fileUrl}" target="_blank">
                            <button>⬇ Pobierz</button>
                          </a>`
                        : ""
                    }

                </div>
            </div>
        `;
    });
}

</script>

</body>
</html>
