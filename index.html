<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC26 Mods</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    color:white;
    background:
        radial-gradient(circle at top, rgba(0,255,140,.18), transparent 45%),
        radial-gradient(circle at bottom, rgba(0,170,255,.15), transparent 55%),
        linear-gradient(120deg, #05070d, #0b1020);
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        url("https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=2000&q=80");
    background-size:cover;
    background-position:center;
    opacity:.12;
    filter:blur(1.5px) saturate(1.4) contrast(1.1);
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 30%, rgba(0,255,136,.25), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0,180,255,.20), transparent 45%);
    z-index:-1;
    animation: glowMove 8s ease-in-out infinite alternate;
}

@keyframes glowMove{
    from{ transform:scale(1) }
    to{ transform:scale(1.1) }
}

.container{
    max-width:900px;
    margin:auto;
    padding:25px;
}

h1{
    text-align:center;
    color:#00ff88;
    letter-spacing:3px;
    text-transform:uppercase;
    text-shadow:0 0 15px rgba(0,255,136,.5);
}

.sub{
    text-align:center;
    opacity:.7;
    margin-bottom:20px;
}

/* INPUTS */
input, textarea{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:12px;
    border:1px solid rgba(0,255,136,.4);
    background:rgba(5,10,20,.7);
    color:white;
    outline:none;
}

textarea{ min-height:110px; }

/* BUTTON */
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    background:linear-gradient(90deg,#00ff88,#00ccff);
}

/* FORM */
.form{
    display:none;
    background:rgba(0,0,0,.65);
    padding:15px;
    border-radius:14px;
    margin-top:20px;
    backdrop-filter:blur(10px);
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:15px;
    margin-top:20px;
}

/* CARD */
.card{
    background:rgba(10,15,25,.85);
    border:2px solid rgba(0,255,136,.18);
    border-radius:18px;
    overflow:hidden;
    transition:.25s;
    backdrop-filter:blur(10px);
    display:flex;
    flex-direction:column;
    position:relative;
}

.card:hover{
    transform:translateY(-6px);
    border-color:#00ff88;
    box-shadow:0 0 25px rgba(0,255,136,.15);
}

/* IMAGE */
.card img{
    width:100%;
    height:190px;
    object-fit:cover;
}

/* CONTENT */
.card-content{
    padding:12px;
}

/* TITLE */
.title{
    color:#00ff88;
    font-size:18px;
    font-weight:bold;
    margin-bottom:6px;
}

/* DESC */
.desc{
    opacity:.8;
    font-size:13px;
    margin-bottom:10px;
}

/* DELETE BUTTON */
.delete{
    position:absolute;
    top:10px;
    right:10px;
    width:32px;
    height:32px;
    border-radius:8px;
    background:#ff2b2b;
    color:white;
    font-size:16px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    opacity:.9;
}

.delete:hover{
    transform:scale(1.15);
    opacity:1;
}
</style>
</head>

<body>

<div class="container">

    <h1>FC26 Mods</h1>
    <div class="sub">Upload + Download System</div>

    <button onclick="login()">Zaloguj się przez Google</button>

    <div class="form" id="form">

        <input id="name" placeholder="Nazwa moda">
        <textarea id="desc" placeholder="Opis moda"></textarea>
        <input id="fileUrl" placeholder="Link do pliku (download)">
        <input id="imgFile" type="file" accept="image/*">

        <button onclick="addMod()">Dodaj moda</button>

    </div>

    <div class="grid" id="mods"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4GAAVlZEhZuUvsf5RVhHJYngcEjIrVdg",
  authDomain: "fc26mods.firebaseapp.com",
  projectId: "fc26mods",
  storageBucket: "fc26mods.appspot.com",
  messagingSenderId: "136509847285",
  appId: "1:136509847285:web:d2d81cf7832194370d37bc",
  measurementId: "G-SC0XK44T2E"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const ALLOWED_USERS = ["adamskiadrian513@gmail.com"];
let currentUser = null;

window.login = () => signInWithPopup(auth, provider);

onAuthStateChanged(auth, (user) => {
    currentUser = user;

    document.getElementById("form").style.display =
        (user && ALLOWED_USERS.includes(user.email)) ? "block" : "none";

    loadMods();
});

function toBase64(file){
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

window.addMod = async function(){

    const name = document.getElementById("name").value.trim();
    const desc = document.getElementById("desc").value.trim();
    const fileUrl = document.getElementById("fileUrl").value.trim();
    const imgFile = document.getElementById("imgFile").files[0];

    if(!name) return alert("Podaj nazwę moda");

    let imgBase64 = "";

    if(imgFile){
        imgBase64 = await toBase64(imgFile);
    }

    await addDoc(collection(db, "mods"), {
        name,
        desc,
        fileUrl,
        imgUrl: imgBase64,
        time: Date.now()
    });

    document.getElementById("name").value = "";
    document.getElementById("desc").value = "";
    document.getElementById("fileUrl").value = "";
    document.getElementById("imgFile").value = "";

    loadMods();
};

window.deleteMod = async function(id){
    if(confirm("Usunąć moda?")){
        await deleteDoc(doc(db, "mods", id));
        loadMods();
    }
};

async function loadMods(){

    const q = query(collection(db, "mods"), orderBy("time","desc"));
    const snap = await getDocs(q);

    const box = document.getElementById("mods");
    box.innerHTML = "";

    snap.forEach((d) => {
        const m = d.data();

        box.innerHTML += `
            <div class="card">

                ${m.imgUrl ? `<img src="${m.imgUrl}">` : ""}

                <div class="card-content">

                    ${
                        currentUser && ALLOWED_USERS.includes(currentUser.email)
                        ? `<button class="delete" onclick="deleteMod('${d.id}')">×</button>`
                        : ""
                    }

                    <div class="title">${m.name}</div>
                    <div class="desc">${m.desc || ""}</div>

                    ${
                        m.fileUrl
                        ? `<a href="${m.fileUrl}" target="_blank">
                            <button>⬇ Pobierz</button>
                          </a>`
                        : ""
                    }

                </div>
            </div>
        `;
    });
}

</script>

</body>
</html>
