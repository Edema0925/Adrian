<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FC26 Mods</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#05070d;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  color:#00ff88;
}

.sub{
  text-align:center;
  opacity:0.6;
  margin-bottom:20px;
}

button{
  background:linear-gradient(90deg,#00ff88,#00ccff);
  border:none;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  width:100%;
  margin-top:10px;
}

.form{
  display:none;
  background:rgba(0,0,0,0.6);
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
}

input,textarea{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #00ff88;
  background:rgba(0,0,0,0.4);
  color:white;
}

.dropzone{
  border:2px dashed #00ff88;
  padding:20px;
  text-align:center;
  border-radius:10px;
  margin-top:10px;
  cursor:pointer;
  opacity:0.8;
}

.dropzone.drag{
  background:rgba(0,255,136,0.1);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.card{
  background:rgba(0,0,0,0.6);
  padding:10px;
  border-radius:12px;
}

.title{color:#00ff88;font-weight:bold;}
.desc{opacity:0.8;font-size:13px;margin-bottom:10px;}

.delete{
  background:red;
  width:auto;
  padding:5px 8px;
  float:right;
}
</style>
</head>

<body>

<div class="container">
  <h1>FC26 Mods</h1>
  <div class="sub">Upload modów (ZIP / pliki)</div>

  <button onclick="login()">Zaloguj się</button>

  <div class="form" id="form">

    <input id="name" placeholder="Nazwa moda">
    <textarea id="desc" placeholder="Opis moda"></textarea>

    <!-- NORMAL FILE INPUT (NO FILTER = FIX) -->
    <input type="file" id="file">

    <!-- DRAG & DROP -->
    <div class="dropzone" id="dropzone">
      Przeciągnij plik ZIP tutaj lub kliknij
    </div>

    <button onclick="addMod()">Dodaj mod</button>
  </div>

  <div class="grid" id="mods"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4GAAVlZEhZuUvsf5RVhHJYngcEjIrVdg",
  authDomain: "fc26mods.firebaseapp.com",
  projectId: "fc26mods",
  storageBucket: "fc26mods.firebasestorage.app",
  messagingSenderId: "136509847285",
  appId: "1:136509847285:web:d2d81cf7832194370d37bc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const provider = new GoogleAuthProvider();

const ALLOWED_USERS = ["adamskiadrian513@gmail.com"];

let currentUser = null;
let selectedFile = null;

window.login = () => signInWithPopup(auth, provider);

onAuthStateChanged(auth, (user)=>{
  currentUser = user;

  if(user && ALLOWED_USERS.includes(user.email)){
    document.getElementById("form").style.display="block";
    loadMods();
  } else {
    document.getElementById("form").style.display="none";
  }
});

const fileInput = document.getElementById("file");
const dropzone = document.getElementById("dropzone");

fileInput.addEventListener("change", e=>{
  selectedFile = e.target.files[0];
});

dropzone.addEventListener("click", ()=> fileInput.click());

dropzone.addEventListener("dragover", e=>{
  e.preventDefault();
  dropzone.classList.add("drag");
});

dropzone.addEventListener("dragleave", ()=>{
  dropzone.classList.remove("drag");
});

dropzone.addEventListener("drop", e=>{
  e.preventDefault();
  dropzone.classList.remove("drag");
  selectedFile = e.dataTransfer.files[0];
  fileInput.files = e.dataTransfer.files;
});

window.addMod = async function(){

  const name = document.getElementById("name").value;
  const desc = document.getElementById("desc").value;

  if(!name) return;

  let fileUrl = "";

  if(selectedFile){
    const fileRef = ref(storage, "mods/" + Date.now() + "_" + selectedFile.name);

    await uploadBytes(fileRef, selectedFile, {
      contentType: selectedFile.type || "application/zip"
    });

    fileUrl = await getDownloadURL(fileRef);
  }

  await addDoc(collection(db,"mods"),{
    name,
    desc,
    fileUrl,
    time: Date.now()
  });

  document.getElementById("name").value = "";
  document.getElementById("desc").value = "";
  fileInput.value = "";
  selectedFile = null;

  loadMods();
};

window.deleteMod = async function(id){
  await deleteDoc(doc(db,"mods",id));
  loadMods();
};

async function loadMods(){

  const q = query(collection(db,"mods"), orderBy("time","desc"));
  const snap = await getDocs(q);

  const box = document.getElementById("mods");
  box.innerHTML = "";

  snap.forEach(d=>{
    const m = d.data();

    box.innerHTML += `
      <div class="card">
        ${currentUser && ALLOWED_USERS.includes(currentUser.email) ? 
          `<button class="delete" onclick="deleteMod('${d.id}')">X</button>` : ""}

        <div class="title">${m.name}</div>
        <div class="desc">${m.desc}</div>

        ${m.fileUrl ? `
          <a href="${m.fileUrl}" download>
            <button>⬇ Pobierz plik</button>
          </a>
        ` : ""}
      </div>
    `;
  });
}

</script>

</body>
</html>
