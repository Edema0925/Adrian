<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC26 Mods</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    color:white;
    overflow-x:hidden;

    /* 🎮 FC STYLE BACKGROUND */
    background:
        linear-gradient(135deg, rgba(0,0,0,.85), rgba(0,0,0,.4)),
        url("https://upload.wikimedia.org/wikipedia/commons/6/6f/Jamal_Musiala_2022.jpg")
        center/cover no-repeat fixed;
}

/* 🔥 DARK OVERLAY + GLOW */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at top, rgba(255,255,255,0.05), transparent 40%),
        rgba(0,0,0,.65);
    z-index:-1;
}

/* 🪄 LOGO WATERMARK (opcjonalne logo.png) */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:url("logo.png") no-repeat center;
    background-size:280px;
    opacity:0.06;
    pointer-events:none;
    z-index:-1;
}

/* ===== TOP BAR ===== */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;

    background:rgba(10,10,10,.55);
    backdrop-filter:blur(15px);

    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:18px;
    font-weight:bold;
    letter-spacing:3px;
    color:#fff;
    text-shadow:0 0 10px rgba(255,255,255,.2);
}

.menu{
    display:flex;
    gap:15px;
    font-size:13px;
    opacity:.75;
}

/* ===== CONTAINER ===== */
.container{
    max-width:1100px;
    margin:auto;
    padding:25px;
}

/* ===== TITLE ===== */
h1{
    font-size:28px;
    text-transform:uppercase;
    letter-spacing:4px;
    color:#fff;
    margin-bottom:5px;
    text-shadow:0 0 10px rgba(255,255,255,.15);
}

.sub{
    opacity:.6;
    margin-bottom:20px;
}

/* ===== FORM (glass effect) ===== */
.form{
    display:none;
    background:rgba(20,20,20,.55);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    padding:15px;
    margin-bottom:20px;
    backdrop-filter:blur(10px);
}

/* ===== INPUTS ===== */
input, textarea{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(0,0,0,.5);
    color:white;
    outline:none;
}

/* ===== BUTTON ===== */
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    background:linear-gradient(135deg,#1f1f1f,#2c2c2c);
    color:#e5e5e5;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    background:linear-gradient(135deg,#2a2a2a,#3a3a3a);
}

/* ===== GRID ===== */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
}

/* ===== CARD (glass + FC style) ===== */
.card{
    background:rgba(10,10,10,.55);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    overflow:hidden;
    transition:.25s;
    position:relative;
    backdrop-filter:blur(10px);
}

.card:hover{
    transform:translateY(-6px);
    border-color:rgba(255,255,255,.2);
}

/* IMAGE */
.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    filter:contrast(1.1) brightness(.9);
}

/* CONTENT */
.card-content{
    padding:12px;
}

.title{
    font-size:16px;
    font-weight:bold;
    letter-spacing:1px;
}

.desc{
    opacity:.7;
    font-size:13px;
    margin-top:5px;
}

/* ===== DELETE BUTTON (zostawione, tylko ładniejsze) ===== */
.delete{
    position:absolute;
    top:10px;
    right:10px;
    width:30px;
    height:30px;
    border-radius:8px;
    background:rgba(0,0,0,.6);
    border:1px solid rgba(255,255,255,.15);
    color:white;
    cursor:pointer;
    transition:.2s;
}

.delete:hover{
    background:red;
    transform:scale(1.05);
}
</style>

<body>
    <div class="topbar">
  <div class="logo">FC26 MODS</div>
  <div class="menu">
    <div>HOME</div>
    <div>MODS</div>
    <div>UPLOAD</div>
  </div>
</div>

<div class="container">

    <h1>FC26 Mods</h1>
    <div class="sub">Upload + Download System</div>

    <button onclick="login()">Zaloguj się przez Google</button>

    <div class="form" id="form">

        <input id="name" placeholder="Nazwa moda">
        <textarea id="desc" placeholder="Opis moda"></textarea>
        <input id="fileUrl" placeholder="Link do pliku (download)">
        <input id="imgFile" type="file" accept="image/*">

        <button onclick="addMod()">Dodaj moda</button>

    </div>

    <div class="grid" id="mods"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4GAAVlZEhZuUvsf5RVhHJYngcEjIrVdg",
  authDomain: "fc26mods.firebaseapp.com",
  projectId: "fc26mods",
  storageBucket: "fc26mods.appspot.com",
  messagingSenderId: "136509847285",
  appId: "1:136509847285:web:d2d81cf7832194370d37bc",
  measurementId: "G-SC0XK44T2E"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const ALLOWED_USERS = ["adamskiadrian513@gmail.com"];
let currentUser = null;

window.login = () => signInWithPopup(auth, provider);

onAuthStateChanged(auth, (user) => {
    currentUser = user;

    document.getElementById("form").style.display =
        (user && ALLOWED_USERS.includes(user.email)) ? "block" : "none";

    loadMods();
});

function toBase64(file){
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

window.addMod = async function(){

    const name = document.getElementById("name").value.trim();
    const desc = document.getElementById("desc").value.trim();
    const fileUrl = document.getElementById("fileUrl").value.trim();
    const imgFile = document.getElementById("imgFile").files[0];

    if(!name) return alert("Podaj nazwę moda");

    let imgBase64 = "";

    if(imgFile){
        imgBase64 = await toBase64(imgFile);
    }

    await addDoc(collection(db, "mods"), {
        name,
        desc,
        fileUrl,
        imgUrl: imgBase64,
        time: Date.now()
    });

    document.getElementById("name").value = "";
    document.getElementById("desc").value = "";
    document.getElementById("fileUrl").value = "";
    document.getElementById("imgFile").value = "";

    loadMods();
};

window.deleteMod = async function(id){
    if(confirm("Usunąć moda?")){
        await deleteDoc(doc(db, "mods", id));
        loadMods();
    }
};

async function loadMods(){

    const q = query(collection(db, "mods"), orderBy("time","desc"));
    const snap = await getDocs(q);

    const box = document.getElementById("mods");
    box.innerHTML = "";

    snap.forEach((d) => {
        const m = d.data();

        box.innerHTML += `
            <div class="card">

                ${m.imgUrl ? `<img src="${m.imgUrl}">` : ""}

                <div class="card-content">

                    ${
                        currentUser && ALLOWED_USERS.includes(currentUser.email)
                        ? `<button class="delete" onclick="deleteMod('${d.id}')">×</button>`
                        : ""
                    }

                    <div class="title">${m.name}</div>
                    <div class="desc">${m.desc || ""}</div>

                    ${
                        m.fileUrl
                        ? `<a href="${m.fileUrl}" target="_blank">
                            <button>⬇ Pobierz</button>
                          </a>`
                        : ""
                    }

                </div>
            </div>
        `;
    });
}

</script>

</body>
</html>
