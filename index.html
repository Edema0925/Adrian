<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC26 Mods Hub</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  background:#05070d;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(0,255,136,0.25), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(0,140,255,0.25), transparent 45%),
    radial-gradient(circle at 50% 80%, rgba(255,0,120,0.15), transparent 50%),
    linear-gradient(120deg,#05070d,#0a0f1c);
  z-index:-2;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  color:#00ff88;
  text-shadow:0 0 25px #00ff88;
}

input,textarea{
  width:100%;
  margin:6px 0;
  padding:10px;
  border-radius:10px;
  border:1px solid #00ff88;
  background:rgba(0,0,0,0.5);
  color:white;
}

button{
  background:linear-gradient(90deg,#00ff88,#00ccff);
  border:none;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  transform:scale(1.05);
}

.form{
  background:rgba(0,0,0,0.6);
  padding:15px;
  border-radius:12px;
  display:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  margin-top:20px;
}

.card{
  background:rgba(0,0,0,0.6);
  border:1px solid rgba(0,255,136,0.2);
  border-radius:12px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.card-body{
  padding:10px;
}

.title{color:#00ff88;font-weight:bold}
.desc{opacity:0.8;font-size:13px}
.file{color:#00ccff;font-size:12px}
</style>
</head>

<body>

<div class="container">
<h1>FC26 Mods Hub</h1>

<input type="password" id="pass" placeholder="Hasło admina">
<button onclick="login()">Zaloguj</button>

<div class="form" id="form">
  <input id="name" placeholder="Nazwa moda">
  <textarea id="desc" placeholder="Opis"></textarea>
  <input type="file" id="img" accept="image/*">
  <button onclick="addMod()">Dodaj mod</button>
</div>

<div class="grid" id="mods"></div>
</div>

<script>

let mods = JSON.parse(localStorage.getItem("mods")) || [];

function login(){
  if(document.getElementById("pass").value==="admin123"){
    document.getElementById("form").style.display="block";
  } else alert("Złe hasło");
}

function save(){
  localStorage.setItem("mods", JSON.stringify(mods));
}

function addMod(){
  let name=document.getElementById("name").value;
  let desc=document.getElementById("desc").value;
  let img=document.getElementById("img").files[0];

  if(!name) return;

  const create=(imgData)=>{
    mods.unshift({name,desc,img:imgData});
    save();
    render();
  };

  if(img){
    let r=new FileReader();
    r.onload=e=>create(e.target.result);
    r.readAsDataURL(img);
  } else create(null);
}

function render(){
  let box=document.getElementById("mods");
  box.innerHTML="";

  mods.forEach(m=>{
    box.innerHTML+=`
      <div class="card">
        ${m.img?`<img src="${m.img}">`:""}
        <div class="card-body">
          <div class="title">${m.name}</div>
          <div class="desc">${m.desc}</div>
        </div>
      </div>
    `;
  });
}

render();

</script>

</body>
</html>
