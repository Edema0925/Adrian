<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FC26 Mods Hub PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  background:#05070d;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(0,255,136,0.25), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(0,140,255,0.25), transparent 45%),
    radial-gradient(circle at 50% 80%, rgba(255,0,120,0.15), transparent 50%),
    linear-gradient(120deg,#05070d,#0a0f1c);
  z-index:-2;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  color:#00ff88;
  text-shadow:0 0 25px #00ff88;
}

.sub{
  text-align:center;
  opacity:0.6;
  margin-bottom:20px;
}

.login{
  text-align:center;
  margin-bottom:15px;
}

input,textarea{
  width:100%;
  margin:6px 0;
  padding:10px;
  border-radius:10px;
  border:1px solid #00ff88;
  background:rgba(0,0,0,0.5);
  color:white;
}

button{
  background:linear-gradient(90deg,#00ff88,#00ccff);
  border:none;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  transform:scale(1.05);
}

.form{
  display:none;
  background:rgba(0,0,0,0.6);
  padding:15px;
  border-radius:12px;
  border:1px solid rgba(0,255,136,0.3);
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.card{
  background:rgba(0,0,0,0.6);
  border:1px solid rgba(0,255,136,0.2);
  border-radius:12px;
  padding:10px;
  position:relative;
}

.title{color:#00ff88;font-weight:bold}
.desc{opacity:0.8;font-size:13px}

.delete{
  position:absolute;
  top:8px;
  right:8px;
  background:red;
  border:none;
  color:white;
  padding:5px 8px;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
  <h1>FC26 Mods Hub PRO</h1>
  <div class="sub">Firebase Mod System</div>

  <div class="login">
    <button onclick="login()">Zaloguj Google</button>
  </div>

  <div class="form" id="form">
    <input id="name" placeholder="Nazwa moda">
    <textarea id="desc" placeholder="Opis moda"></textarea>
    <button onclick="addMod()">Dodaj mod</button>
  </div>

  <div class="grid" id="mods"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


// 🔥 TWOJE FIREBASE (JUŻ WPISANE)
const firebaseConfig = {
  apiKey: "AIzaSyC4GAAVlZEhZuUvsf5RVhHJYngcEjIrVdg",
  authDomain: "fc26mods.firebaseapp.com",
  projectId: "fc26mods",
  storageBucket: "fc26mods.firebasestorage.app",
  messagingSenderId: "136509847285",
  appId: "1:136509847285:web:d2d81cf7832194370d37bc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();


// 🔐 TYLKO TY (ZMIEN SWÓJ EMAIL!)
const ALLOWED_USERS = [
  "TWOJ_EMAIL@gmail.com"
];

let currentUser = null;


// LOGIN
window.login = function(){
  signInWithPopup(auth, provider);
};


// CHECK USER
onAuthStateChanged(auth, (user)=>{
  currentUser = user;

  if(user && ALLOWED_USERS.includes(user.email)){
    document.getElementById("form").style.display="block";
    loadMods();
  } else {
    document.getElementById("form").style.display="none";
  }
});


// DODAJ MOD
window.addMod = async function(){
  const name = document.getElementById("name").value;
  const desc = document.getElementById("desc").value;

  if(!name) return;

  await addDoc(collection(db,"mods"),{
    name,
    desc,
    time: Date.now()
  });

  loadMods();
};


// USUŃ MOD
window.deleteMod = async function(id){
  await deleteDoc(doc(db,"mods",id));
  loadMods();
};


// POBIERZ MODY
async function loadMods(){
  const q = query(collection(db,"mods"), orderBy("time","desc"));
  const snap = await getDocs(q);

  const box = document.getElementById("mods");
  box.innerHTML="";

  snap.forEach(d=>{
    const m = d.data();

    box.innerHTML += `
      <div class="card">
        ${currentUser && ALLOWED_USERS.includes(currentUser.email) 
          ? `<button class="delete" onclick="deleteMod('${d.id}')">X</button>` 
          : ""}
        <div class="title">${m.name}</div>
        <div class="desc">${m.desc}</div>
      </div>
    `;
  });
}

</script>

</body>
</html>
