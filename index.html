<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC26 MODS</title>

<style>
body{
margin:0;
font-family:Segoe UI,Arial;
background:#0b0f17;
color:#fff;
}

header{
padding:20px;
text-align:center;
background:#151c2a;
font-size:20px;
font-weight:bold;
}

.container{max-width:1200px;margin:auto;padding:20px}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:10px;
margin-bottom:10px;
}

input,select,button{
padding:10px;
border-radius:8px;
border:1px solid #2a3445;
background:#141b2a;
color:#fff;
outline:none;
}

button{
cursor:pointer;
background:#00c16a;
border:none;
font-weight:bold;
}

button:hover{opacity:0.85}

.card{
background:#141b2a;
padding:12px;
border-radius:12px;
margin-top:10px;
border:1px solid #222c3d;
}

.badge{
font-size:12px;
padding:3px 8px;
border-radius:20px;
background:#333;
margin-right:5px;
}

.installed{background:#00c16a}
.todo{background:#ff9800}
.favorite{background:#ff3b7a}

.stats{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin:10px 0;
}

.stat{
background:#141b2a;
padding:10px;
border-radius:10px;
text-align:center;
}

img{
width:100%;
border-radius:10px;
margin-bottom:10px;
}
</style>
</head>

<body>

<header>🎮 FC26 MODS</header>

<div class="container">

<div class="stats">
<div class="stat"><div id="countAll">0</div><small>Wszystkie</small></div>
<div class="stat"><div id="countInstalled">0</div><small>Zainstalowane</small></div>
<div class="stat"><div id="countFav">0</div><small>Ulubione</small></div>
<div class="stat"><div id="countCareer">0</div><small>Career</small></div>
<div class="stat"><div id="countGameplay">0</div><small>Gameplay</small></div>
</div>

<div class="grid">
<input id="name" placeholder="Nazwa moda">
<input id="link" placeholder="Link">
<input id="tags" placeholder="Tagi (np. realism,faces)">

<select id="category">
<option>Career Mode</option>
<option>Gameplay</option>
<option>Faces</option>
<option>Kits</option>
<option>Graphics</option>
<option>Other</option>
</select>

<select id="status">
<option>Do pobrania</option>
<option>Zainstalowany</option>
</select>

<input type="file" id="image" accept="image/*">
<input type="file" id="file">
</div>

<button onclick="addMod()">➕ Dodaj Mod</button>

<br><br>

<input id="search" placeholder="Szukaj..." oninput="render()">
<select id="filter" onchange="render()">
<option value="all">Wszystkie</option>
<option>Career Mode</option>
<option>Gameplay</option>
<option>Faces</option>
<option>Kits</option>
<option>Graphics</option>
<option>Other</option>
</select>

<div id="mods"></div>

</div>

<script>

let db;
let mods = [];
let fileData = null;
let imageData = null;

function openDB(){
const req = indexedDB.open("fc26mods",1);

req.onupgradeneeded = e=>{
db = e.target.result;
db.createObjectStore("mods",{keyPath:"id"});
};

req.onsuccess = e=>{
db = e.target.result;
loadMods();
};
}

function saveDB(){
const tx = db.transaction("mods","readwrite");
const store = tx.objectStore("mods");
store.clear();
mods.forEach(m=>store.put(m));
}

function loadMods(){
const tx = db.transaction("mods","readonly");
const store = tx.objectStore("mods");

store.getAll().onsuccess = e=>{
mods = e.target.result || [];
render();
stats();
};
}

document.getElementById("file").onchange = e=>{
const f = e.target.files[0];
if(!f) return;

const r = new FileReader();
r.onload = ()=> fileData = r.result;
r.readAsDataURL(f);
};

document.getElementById("image").onchange = e=>{
const f = e.target.files[0];
if(!f) return;

const r = new FileReader();
r.onload = ()=> imageData = r.result;
r.readAsDataURL(f);
};

function addMod(){
if(!name.value) return;

mods.push({
id:crypto.randomUUID(),
name:name.value,
link:link.value,
category:category.value,
status:status.value,
tags:tags.value.split(",").map(t=>t.trim()),
file:fileData,
image:imageData,
fav:false,
date:Date.now()
});

name.value="";
link.value="";
tags.value="";
fileData=null;
imageData=null;

saveDB();
render();
stats();
}

function del(id){
mods = mods.filter(m=>m.id!==id);
saveDB();render();stats();
}

function toggle(id){
let m = mods.find(x=>x.id===id);
m.status = m.status==="Zainstalowany"?"Do pobrania":"Zainstalowany";
saveDB();render();stats();
}

function fav(id){
let m = mods.find(x=>x.id===id);
m.fav = !m.fav;
saveDB();render();stats();
}

function render(){
let s = search.value.toLowerCase();
let f = filter.value;

let data = mods.filter(m=>{
return m.name.toLowerCase().includes(s)
&& (f==="all" || m.category===f);
});

modsDiv.innerHTML = data.map(m=>`
<div class="card">

${m.image ? `<img src="${m.image}">` : ""}

<h3>${m.name}</h3>

<div>
<span class="badge">${m.category}</span>
<span class="badge ${m.status==="Zainstalowany"?"installed":"todo"}">${m.status}</span>
${m.fav?'<span class="badge favorite">★</span>':''}
</div>

<p>${(m.tags||[]).join(", ")}</p>

${m.link?`<a href="${m.link}" target="_blank">🔗 Link</a>`:""}
${m.file?`<p>📦 plik dodany</p>`:""}

<br><br>

<button onclick="toggle('${m.id}')">Zmień status</button>
<button onclick="fav('${m.id}')">★</button>
<button onclick="del('${m.id}')">Usuń</button>

</div>
`).join("");
}

function stats(){
countAll.innerText = mods.length;
countInstalled.innerText = mods.filter(m=>m.status==="Zainstalowany").length;
countFav.innerText = mods.filter(m=>m.fav).length;
countCareer.innerText = mods.filter(m=>m.category==="Career Mode").length;
countGameplay.innerText = mods.filter(m=>m.category==="Gameplay").length;
}

openDB();

</script>

</body>
</html>
