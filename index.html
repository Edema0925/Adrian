<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC26 Mods</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Inter', Arial, sans-serif;
    color:#cfcfd4;
    overflow-x:hidden;
    overflow-y:auto;
    background:
        linear-gradient(135deg, rgba(0,0,0,.92), rgba(0,0,0,.65)),
        url("https://wallpapers.com/images/hd/ea-sports-fc-24-4k-8jz8z7x6q7z7z7x6.jpg")
        center/cover no-repeat fixed;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.04), transparent 60%),
        radial-gradient(circle at bottom, rgba(0,0,0,0.8), transparent 70%);
    z-index:-1;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;
    background:rgba(13,13,15,.65);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.05);
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:4px;
}

.menu{
    display:flex;
    gap:25px;
    font-size:15px;
    opacity:.75;
}

.container{
    width:100%;
    max-width:1200px;
    margin:0 auto;
    padding:20px;
}

h1{
    font-size:32px;
    text-transform:uppercase;
    letter-spacing:4px;
}

.sub{
    opacity:.6;
    margin-bottom:10px;
}

.stats{
    margin-bottom:20px;
    opacity:.8;
    font-size:14px;
}

.form{
    display:none;
    background:rgba(26,26,29,.55);
    border-radius:16px;
    padding:20px;
    margin-bottom:25px;
}

input, textarea{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:12px;
    background:rgba(0,0,0,.45);
    color:#cfcfd4;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#111;
    color:#cfcfd4;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:rgba(13,13,15,.55);
    border-radius:18px;
    overflow:hidden;
    padding:10px;
}

.card img{
    width:100%;
    height:190px;
    object-fit:cover;
}

.title{
    font-weight:800;
    margin-top:10px;
}

.desc{
    opacity:.7;
    font-size:14px;
}

.delete{
    float:right;
    background:red;
    width:30px;
    height:30px;
    border-radius:8px;
}

.loader{
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="logo">FC26 MODS</div>
  <div class="menu">
    <div>HOME</div>
    <div>MODS</div>
    <div>UPLOAD</div>
  </div>
</div>

<div class="container">

<h1>FC26 Mods</h1>
<div class="sub">Upload + Download System</div>

<div class="stats">
📦 Mody: <span id="modsCount">0</span> | ⬇ Pobrania: <span id="downloadsCount">0</span>
</div>

<button onclick="login()">Zaloguj się przez Google</button>

<div class="form" id="form">
    <input id="name" placeholder="Nazwa moda">
    <textarea id="desc" placeholder="Opis moda"></textarea>
    <input id="fileUrl" placeholder="Link do pliku">
    <input id="imgFile" type="file">
    <button onclick="addMod()">Dodaj moda</button>
</div>

<div id="loader" class="loader" style="display:none;">Ładowanie...</div>
<div class="grid" id="mods"></div>

</div>

<footer class="footer">FC26 Mods © 2026</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4GAAVlZEhZuUvsf5RVhHJYngcEjIrVdg",
  authDomain: "fc26mods.firebaseapp.com",
  projectId: "fc26mods",
  storageBucket: "fc26mods.appspot.com",
  messagingSenderId: "136509847285",
  appId: "1:136509847285:web:d2d81cf7832194370d37bc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const ALLOWED_USERS = ["adamskiadrian513@gmail.com"];
let currentUser = null;

window.login = () => signInWithPopup(auth, provider);

onAuthStateChanged(auth, (user) => {
    currentUser = user;
    document.getElementById("form").style.display =
        (user && ALLOWED_USERS.includes(user.email)) ? "block" : "none";

    loadMods();
});

function toBase64(file){
    return new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(file);
    });
}

window.addMod = async function(){
    const name = name.value;
    const desc = desc.value;
    const fileUrl = fileUrl.value;
    const imgFile = document.getElementById("imgFile").files[0];

    let imgBase64 = "";
    if(imgFile) imgBase64 = await toBase64(imgFile);

    await addDoc(collection(db,"mods"),{
        name, desc, fileUrl,
        imgUrl: imgBase64,
        time: Date.now(),
        downloads: 0
    });

    loadMods();
};

window.downloadMod = async function(id,url){
    await updateDoc(doc(db,"mods",id),{
        downloads: increment(1)
    });

    loadMods();
    window.open(url,"_blank");
};

window.deleteMod = async function(id){
    await deleteDoc(doc(db,"mods",id));
    loadMods();
};

async function loadMods(){
    const box = document.getElementById("mods");
    const loader = document.getElementById("loader");

    loader.style.display="block";
    box.innerHTML="";

    const q = query(collection(db,"mods"),orderBy("time","desc"));
    const snap = await getDocs(q);

    let total = 0;

    snap.forEach(d=>{
        const m = d.data();
        total += (m.downloads||0);

        box.innerHTML += `
        <div class="card">
            ${m.imgUrl?`<img src="${m.imgUrl}">`:``}

            ${currentUser && ALLOWED_USERS.includes(currentUser.email)
              ? `<button class="delete" onclick="deleteMod('${d.id}')">×</button>`
              : ""}

            <div class="title">${m.name}</div>
            <div class="desc">${m.desc||""}</div>

            <button onclick="downloadMod('${d.id}','${m.fileUrl}')">
                ⬇ Pobierz (${m.downloads||0})
            </button>
        </div>`;
    });

    document.getElementById("modsCount").textContent = snap.size;
    document.getElementById("downloadsCount").textContent = total;

    loader.style.display="none";
}

</script>

</body>
</html>
