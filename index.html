<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC26 Mods</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#05070d;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    color:#00ff88;
}

.sub{
    text-align:center;
    opacity:.7;
    margin-bottom:20px;
}

input,
textarea{
    width:100%;
    box-sizing:border-box;
    padding:10px;
    margin:6px 0;
    border-radius:10px;
    border:1px solid #00ff88;
    background:rgba(0,0,0,.5);
    color:white;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    background:linear-gradient(90deg,#00ff88,#00ccff);
}

.form{
    display:none;
    background:rgba(0,0,0,.6);
    padding:15px;
    border-radius:12px;
    margin-top:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    margin-top:20px;
}

.card{
    background:rgba(0,0,0,.6);
    border:1px solid rgba(0,255,136,.2);
    padding:15px;
    border-radius:12px;
    position:relative;
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    border-color:#00ff88;
}

.title{
    color:#00ff88;
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.desc{
    opacity:.8;
    font-size:13px;
    margin-bottom:12px;
}

.delete{
    position:absolute;
    top:8px;
    right:8px;
    width:auto;
    padding:5px 8px;
    background:red;
    color:white;
}
</style>
</head>

<body>

<div class="container">

    <h1>FC26 Mods</h1>
    <div class="sub">Upload + Download System</div>

    <button onclick="login()">Zaloguj się przez Google</button>

  <div class="form" id="form">

    <input id="name" placeholder="Nazwa moda">
    <textarea id="desc" placeholder="Opis moda"></textarea>

    <!-- LINK -->
    <a href="#" onclick="document.getElementById('fileInput').click()">
        Dodaj plik
    </a>

    <!-- UKRYTY INPUT -->
    <input type="file" id="fileInput" style="display:none">

</div>
    <div class="grid" id="mods"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4GAAVlZEhZuUvsf5RVhHJYngcEjIrVdg",
  authDomain: "fc26mods.firebaseapp.com",
  projectId: "fc26mods",
  storageBucket: "fc26mods.appspot.com",
  messagingSenderId: "136509847285",
  appId: "1:136509847285:web:d2d81cf7832194370d37bc",
  measurementId: "G-SC0XK44T2E"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const provider = new GoogleAuthProvider();

const ALLOWED_USERS = [
    "adamskiadrian513@gmail.com"
];

let currentUser = null;
let selectedFile = null;

window.login = () => {
    signInWithPopup(auth, provider);
};

onAuthStateChanged(auth, (user) => {

    currentUser = user;

    if (user && ALLOWED_USERS.includes(user.email)) {
        document.getElementById("form").style.display = "block";
    } else {
        document.getElementById("form").style.display = "none";
    }

    loadMods();
});

document
.getElementById("file")
.addEventListener("change", (e) => {
    selectedFile = e.target.files[0];
});

window.addMod = async function(){

    try{

        const name = document.getElementById("name").value.trim();
        const desc = document.getElementById("desc").value.trim();

        if(!name){
            alert("Podaj nazwę moda");
            return;
        }

        let fileUrl = "";

        if(selectedFile){

            const fileRef = ref(
                storage,
                "mods/" + Date.now() + "_" + selectedFile.name
            );

            await uploadBytes(fileRef, selectedFile);

            fileUrl = await getDownloadURL(fileRef);
        }

        await addDoc(collection(db, "mods"), {
            name,
            desc,
            fileUrl,
            time: Date.now()
        });

        document.getElementById("name").value = "";
        document.getElementById("desc").value = "";
        document.getElementById("file").value = "";

        selectedFile = null;

        loadMods();

    }catch(err){

        console.error(err);
        alert(err.message);

    }
};

window.deleteMod = async function(id){

    if(!confirm("Usunąć tego moda?")){
        return;
    }

    await deleteDoc(doc(db, "mods", id));

    loadMods();
};

async function loadMods(){

    const q = query(
        collection(db, "mods"),
        orderBy("time", "desc")
    );

    const snap = await getDocs(q);

    const box = document.getElementById("mods");

    box.innerHTML = "";

    snap.forEach((d) => {

        const m = d.data();

        box.innerHTML += `
            <div class="card">

                ${
                    currentUser &&
                    ALLOWED_USERS.includes(currentUser.email)
                    ? `<button class="delete" onclick="deleteMod('${d.id}')">X</button>`
                    : ""
                }

                <div class="title">${m.name}</div>

                <div class="desc">
                    ${m.desc || ""}
                </div>

                ${
                    m.fileUrl
                    ? `
                    <a href="${m.fileUrl}" target="_blank">
                        <button>⬇ Pobierz</button>
                    </a>
                    `
                    : ""
                }

            </div>
        `;
    });
}

</script>

</body>
</html>
