```html
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC26 Mods</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#05070d;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  color:#00ff88;
}

.sub{
  text-align:center;
  opacity:.7;
  margin-bottom:20px;
}

input,
textarea{
  width:100%;
  box-sizing:border-box;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #00ff88;
  background:rgba(0,0,0,.5);
  color:white;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(90deg,#00ff88,#00ccff);
}

.form{
  display:none;
  background:rgba(0,0,0,.6);
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.card{
  background:rgba(0,0,0,.6);
  padding:10px;
  border-radius:12px;
  position:relative;
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:10px;
}

.title{
  color:#00ff88;
  font-weight:bold;
  font-size:18px;
}

.desc{
  opacity:.85;
  font-size:14px;
  margin:8px 0;
}

.delete{
  position:absolute;
  top:8px;
  right:8px;
  width:auto;
  padding:5px 8px;
  background:red;
  color:white;
}
</style>
</head>

<body>

<div class="container">

  <h1>FC26 Mods</h1>
  <div class="sub">Mody do FC26</div>

  <button onclick="login()">Zaloguj się</button>

  <div class="form" id="form">

    <input id="name" placeholder="Nazwa moda">

    <textarea id="desc" placeholder="Opis moda"></textarea>

    <input id="imageUrl" placeholder="Link do zdjęcia">

    <input id="downloadLink" placeholder="Link do pobrania">

    <button onclick="addMod()">Dodaj mod</button>

  </div>

  <div class="grid" id="mods"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "TWOJ_API_KEY",
  authDomain: "fc26mods.firebaseapp.com",
  projectId: "fc26mods",
  storageBucket: "fc26mods.appspot.com",
  messagingSenderId: "136509847285",
  appId: "TWOJ_APP_ID"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

const provider = new GoogleAuthProvider();

const ALLOWED_USERS = [
  "adamskiadrian513@gmail.com"
];

let currentUser = null;

window.login = () => {
  signInWithPopup(auth, provider);
};

onAuthStateChanged(auth, (user) => {

  currentUser = user;

  if(user && ALLOWED_USERS.includes(user.email)){
    document.getElementById("form").style.display = "block";
  }else{
    document.getElementById("form").style.display = "none";
  }

  loadMods();
});

window.addMod = async () => {

  try{

    const name = document.getElementById("name").value.trim();
    const desc = document.getElementById("desc").value.trim();
    const imageUrl = document.getElementById("imageUrl").value.trim();
    const downloadLink = document.getElementById("downloadLink").value.trim();

    if(!name){
      alert("Podaj nazwę moda");
      return;
    }

    await addDoc(collection(db,"mods"),{
      name,
      desc,
      imageUrl,
      downloadLink,
      time:Date.now()
    });

    document.getElementById("name").value = "";
    document.getElementById("desc").value = "";
    document.getElementById("imageUrl").value = "";
    document.getElementById("downloadLink").value = "";

    loadMods();

  }catch(err){
    console.error(err);
    alert(err.message);
  }
};

window.deleteMod = async(id)=>{

  if(!confirm("Usunąć moda?")) return;

  await deleteDoc(doc(db,"mods",id));

  loadMods();
};

async function loadMods(){

  const box = document.getElementById("mods");

  box.innerHTML = "";

  const q = query(
    collection(db,"mods"),
    orderBy("time","desc")
  );

  const snap = await getDocs(q);

  snap.forEach(d=>{

    const m = d.data();

    box.innerHTML += `
      <div class="card">

        ${
          currentUser &&
          ALLOWED_USERS.includes(currentUser.email)
            ? `<button class="delete" onclick="deleteMod('${d.id}')">X</button>`
            : ""
        }

        ${
          m.imageUrl
            ? `<img src="${m.imageUrl}" alt="${m.name}">`
            : ""
        }

        <div class="title">${m.name}</div>

        <div class="desc">${m.desc || ""}</div>

        ${
          m.downloadLink
            ? `
              <a href="${m.downloadLink}" target="_blank">
                <button>⬇ Pobierz</button>
              </a>
            `
            : ""
        }

      </div>
    `;
  });
}

</script>

</body>
</html>
```
