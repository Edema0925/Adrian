<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC26 Mods</title>

<style>

/* GLOBAL */
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    color:#cfcfd4;
    min-height:100vh;
    overflow-x:hidden;
    background:
        linear-gradient(135deg, rgba(0,0,0,.92), rgba(0,0,0,.7)),
        url("https://wallpapers.com/images/hd/ea-sports-fc-24-4k-8jz8z7x6q7z7z7x6.jpg")
        center/cover no-repeat fixed;
    position:relative;
}

/* overlay */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.05), transparent 60%),
        radial-gradient(circle at bottom, rgba(0,0,0,0.85), transparent 70%);
    pointer-events:none;
}

/* TOPBAR */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 25px;
    background:rgba(13,13,15,.7);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
    font-weight:900;
    letter-spacing:3px;
}

.menu{
    display:flex;
    gap:20px;
    font-size:14px;
    opacity:.7;
}

/* CONTAINER */
.container{
    max-width:1100px;
    margin:0 auto;
    padding:20px;
}

h1{
    margin:10px 0;
    letter-spacing:3px;
}

.sub{
    opacity:.6;
    margin-bottom:20px;
}

/* FORM */
.form{
    display:none;
    background:rgba(20,20,25,.6);
    padding:20px;
    border-radius:14px;
    backdrop-filter:blur(10px);
    margin-bottom:20px;
}

input, textarea{
    width:100%;
    margin:6px 0;
    padding:12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(0,0,0,.4);
    color:white;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#222;
    color:white;
    font-weight:700;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    background:#333;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:15px;
}

/* CARD */
.card{
    background:rgba(15,15,18,.6);
    border-radius:14px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card-content{
    padding:12px;
}

.title{
    font-weight:800;
}

.desc{
    opacity:.7;
    font-size:14px;
    margin-top:5px;
}

/* DELETE */
.delete{
    position:absolute;
    right:10px;
    top:10px;
    width:30px;
    height:30px;
    border-radius:8px;
    background:red;
    border:none;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="topbar">
  <div class="logo">FC26 MODS</div>
  <div class="menu">
    <div>HOME</div>
    <div>MODS</div>
    <div>UPLOAD</div>
  </div>
</div>

<div class="container">

<h1>FC26 Mods</h1>
<div class="sub">Upload / Download system</div>

<button onclick="login()">Zaloguj przez Google</button>

<div class="form" id="form">

    <input id="name" placeholder="Nazwa moda">
    <textarea id="desc" placeholder="Opis"></textarea>
    <input id="fileUrl" placeholder="Link do downloadu">
    <input id="imgFile" type="file">

    <button onclick="addMod()">Dodaj moda</button>
</div>

<div class="grid" id="mods"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4GAAVlZEhZuUvsf5RVhHJYngcEjIrVdg",
  authDomain: "fc26mods.firebaseapp.com",
  projectId: "fc26mods",
  storageBucket: "fc26mods.appspot.com",
  messagingSenderId: "136509847285",
  appId: "1:136509847285:web:d2d81cf7832194370d37bc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const ALLOWED_USERS = ["adamskiadrian513@gmail.com"];
let currentUser = null;

window.login = () => signInWithPopup(auth, provider);

onAuthStateChanged(auth, (user) => {
    currentUser = user;

    document.getElementById("form").style.display =
        (user && ALLOWED_USERS.includes(user.email)) ? "block" : "none";

    loadMods();
});

window.addMod = async function(){

    const name = document.getElementById("name").value;
    const desc = document.getElementById("desc").value;
    const fileUrl = document.getElementById("fileUrl").value;

    await addDoc(collection(db, "mods"), {
        name,
        desc,
        fileUrl,
        time: Date.now()
    });

    loadMods();
};

/* 🔥 HASŁO DO USUWANIA */
window.deleteMod = async function(id){

    const pass = prompt("Podaj hasło aby usunąć moda:");

    if(pass !== "U3SUN"){
        alert("Złe hasło!");
        return;
    }

    await deleteDoc(doc(db, "mods", id));
    loadMods();
};

async function loadMods(){

    const q = query(collection(db, "mods"), orderBy("time","desc"));
    const snap = await getDocs(q);

    const box = document.getElementById("mods");
    box.innerHTML = "";

    snap.forEach((d) => {
        const m = d.data();

        box.innerHTML += `
        <div class="card" style="position:relative">

            <div class="card-content">

                <button class="delete" onclick="deleteMod('${d.id}')">×</button>

                <div class="title">${m.name}</div>
                <div class="desc">${m.desc || ""}</div>

                ${m.fileUrl ? `<a href="${m.fileUrl}" target="_blank"><button>Download</button></a>` : ""}

            </div>
        </div>`;
    });
}

</script>

</body>
</html>
