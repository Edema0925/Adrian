<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FC26 Mods Hub</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      overflow-x: hidden;
      background: #05070d;
    }

    /* FIFA STYLE BACKGROUND */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 20%, rgba(0,255,136,0.25), transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(0,140,255,0.25), transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(255,0,120,0.15), transparent 50%),
        linear-gradient(120deg, #05070d, #0a0f1c);
      z-index: -2;
      animation: moveBg 10s ease-in-out infinite alternate;
    }

    /* floating glow lines */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://www.transparenttextures.com/patterns/cubes.png');
      opacity: 0.05;
      z-index: -1;
    }

    @keyframes moveBg {
      0% { transform: scale(1) translateY(0px); }
      100% { transform: scale(1.1) translateY(-10px); }
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #00ff88;
      text-shadow: 0 0 25px #00ff88;
      font-size: 42px;
      margin-bottom: 5px;
    }

    .hint {
      text-align: center;
      opacity: 0.6;
      margin-bottom: 20px;
    }

    .login {
      text-align: center;
      margin-bottom: 20px;
    }

    .form {
      display: none;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0,255,136,0.3);
      padding: 15px;
      border-radius: 14px;
      margin-bottom: 20px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 25px rgba(0,255,136,0.15);
    }

    input, textarea {
      width: 100%;
      margin-top: 8px;
      margin-bottom: 12px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(0,255,136,0.4);
      background: rgba(0,0,0,0.5);
      color: white;
      outline: none;
    }

    button {
      background: linear-gradient(90deg, #00ff88, #00ccff);
      color: black;
      border: none;
      padding: 10px 15px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0,255,136,0.5);
    }

    .mods {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .card {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0,255,136,0.25);
      border-radius: 14px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px rgba(0,255,136,0.25);
    }

    .card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
    }

    .card-content {
      padding: 10px;
    }

    .name {
      color: #00ff88;
      font-size: 18px;
      font-weight: bold;
    }

    .desc {
      font-size: 14px;
      opacity: 0.85;
      margin-top: 5px;
    }

    .file {
      font-size: 12px;
      color: #00ccff;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>FC26 Mods Hub</h1>
  <div class="hint">FIFA-style mods platform</div>

  <div class="login">
    <input type="password" id="pass" placeholder="Hasło admina" />
    <button onclick="login()">Zaloguj</button>
  </div>

  <div class="form" id="form">
    <input type="text" id="name" placeholder="Nazwa moda" />
    <textarea id="desc" placeholder="Opis moda"></textarea>
    <input type="file" id="file" />
    <input type="file" id="image" accept="image/*" />
    <button onclick="addMod()">Dodaj mod</button>
  </div>

  <div class="mods" id="mods"></div>
</div>

<script>
  const mods = [];

  function login() {
    const pass = document.getElementById('pass').value;
    if (pass === "admin123") {
      document.getElementById('form').style.display = "block";
      alert("Zalogowano jako admin");
    } else {
      alert("Złe hasło");
    }
  }

  function addMod() {
    const name = document.getElementById('name').value.trim();
    const desc = document.getElementById('desc').value.trim();
    const fileInput = document.getElementById('file');
    const imageInput = document.getElementById('image');

    if (!name) return;

    const fileName = fileInput.files[0] ? fileInput.files[0].name : "brak pliku";

    const createMod = (imageData) => {
      mods.unshift({
        name,
        desc,
        fileName,
        image: imageData
      });

      renderMods();

      document.getElementById('name').value = "";
      document.getElementById('desc').value = "";
      fileInput.value = "";
      imageInput.value = "";
    };

    if (imageInput.files[0]) {
      const reader = new FileReader();
      reader.onload = e => createMod(e.target.result);
      reader.readAsDataURL(imageInput.files[0]);
    } else {
      createMod(null);
    }
  }

  function renderMods() {
    const container = document.getElementById('mods');
    container.innerHTML = '';

    mods.forEach(mod => {
      container.innerHTML += `
        <div class="card">
          ${mod.image ? `<img src="${mod.image}" />` : ''}
          <div class="card-content">
            <div class="name">${mod.name}</div>
            <div class="desc">${mod.desc}</div>
            <div class="file">Plik: ${mod.fileName}</div>
          </div>
        </div>
      `;
    });
  }
</script>

</body>
</html>
